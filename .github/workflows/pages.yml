name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        env:
          VITE_API_BASE: https://naming-things.who-cf.workers.dev
          # The cache-busting stamp. Pages serves the document from a CDN for
          # ten minutes and takes no header configuration, so each deploy gives
          # the page an id to recognise itself by and a version.json to compare
          # it against. The attempt number is part of it so re-running this
          # workflow over an unchanged commit still ships a new id.
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
